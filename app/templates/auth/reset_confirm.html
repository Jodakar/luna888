<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luna888 - Новый пароль</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            max-width: 450px;
            width: 100%;
        }
        .logo { font-size: 40px; text-align: center; margin-bottom: 30px; }
        .btn-primary { background: #0f3460; border: none; padding: 12px; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">🌙 <strong>LUNA888</strong></div>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ 'danger' if category == 'error' else 'success' }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        <form method="POST">
            <input type="hidden" name="email" value="{{ email }}">
            <div class="mb-3">
                <label class="form-label">Код из письма</label>
                <input type="text" class="form-control" name="code" maxlength="6" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Новый пароль</label>
                <input type="password" class="form-control" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Обновить пароль</button>
        </form>
    </div>
</body>
</html>
