{% extends 'base.html' %}
{% block title %}Добавить сотрудника{% endblock %}
{% block content %}
<div class="container mt-4">
    <div class="card" style="max-width: 600px;">
        <div class="card-header">➕ Добавить сотрудника</div>
        <div class="card-body">
            <form method="POST" id="employeeForm">
                <div class="mb-3">
                    <label class="form-label">Имя (ФИО) *</label>
                    <input type="text" class="form-control" name="full_name" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email *</label>
                    <input type="email" class="form-control" name="email" id="email" required>
                    <div class="field-hint">Пример: name@example.com</div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Телефон</label>
                    <input type="text" class="form-control" name="phone" id="phone" placeholder="+7 (999) 123-45-67">
                    <div class="field-hint">Формат: +7XXXXXXXXXX</div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Telegram</label>
                    <input type="text" class="form-control" name="telegram" placeholder="ID пользователя">
                    <div class="field-hint">
                        🔍 Как узнать ID: откройте Telegram → найдите @userinfobot → нажмите Start → бот покажет ваш ID
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Должность</label>
                    <input type="text" class="form-control" name="position" placeholder="Например: Кладовщик">
                </div>
                <button type="submit" class="btn btn-primary">Создать</button>
                <a href="{{ url_for('employees.index') }}" class="btn btn-secondary">Отмена</a>
            </form>
        </div>
    </div>
</div>

<script>
document.getElementById('employeeForm').addEventListener('submit', function(e) {
    const email = document.getElementById('email').value.trim();
    const phone = document.getElementById('phone').value.trim();
    let errors = [];
    
    // Валидация email
    if (!email.includes('@') || !email.includes('.')) {
        errors.push('Введите корректный email (должен содержать @ и .)');
    }
    
    // Валидация телефона
    if (phone && !phone.startsWith('+7')) {
        errors.push('Телефон должен начинаться с +7');
    }
    
    if (errors.length > 0) {
        e.preventDefault();
        alert(errors.join('\n'));
    }
});
</script>
{% endblock %}
